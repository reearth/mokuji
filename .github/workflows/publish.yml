name: Publish

# The libraries, from the same v* tag that releases the command
# (release.yml): the crate to crates.io, the TypeScript reader to npm, the
# Python reader to PyPI. Each registry trusts this workflow by OpenID Connect
# (trusted publishing), so no registry token is kept in the repository; the
# one-time setup on each registry is in RELEASING.md.

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # One version for everything a tag publishes: the crate, both packages and
  # the command all say it, and a registry never takes a version back.
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every package is the tag's version
        run: |
          python3 - <<'EOF'
          import json, os, re, sys, tomllib
          tag = os.environ["GITHUB_REF_NAME"]
          versions = {
              "Cargo.toml": tomllib.load(open("Cargo.toml", "rb"))["package"]["version"],
              "js/package.json": json.load(open("js/package.json"))["version"],
              "python/pyproject.toml": tomllib.load(open("python/pyproject.toml", "rb"))["project"]["version"],
              # What the writers record as generator.version.
              "go/version.go": re.search(r'const Version = "([^"]+)"', open("go/version.go").read())[1],
              "js/src/writer.ts": re.search(r'export const VERSION = "([^"]+)"', open("js/src/writer.ts").read())[1],
              "python/mokuji/writer.py": re.search(r'^VERSION = "([^"]+)"', open("python/mokuji/writer.py").read(), re.M)[1],
          }
          wrong = {path: v for path, v in versions.items() if f"v{v}" != tag}
          for path, v in wrong.items():
              print(f"::error file={path}::{path} says {v}, but the tag is {tag}.")
          sys.exit(1 if wrong else 0)
          EOF

  crates:
    needs: version
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write # trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      # A token for this one publish, from crates.io's trust in this workflow.
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      # cargo publish builds the package as it will be published before it
      # uploads it; the tests ran in CI on the commit being tagged.
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  npm:
    needs: version
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # trusted publishing, and provenance
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11
      # package.json is private until publishing is decided (RELEASING.md);
      # say so rather than let npm refuse with less to go on.
      - name: The package is not private
        run: |
          if node -e 'process.exit(require("./package.json").private ? 0 : 1)'; then
            echo "::error file=js/package.json::js/package.json is private; remove \"private\": true to publish it."
            exit 1
          fi
      - run: npm ci
      # dist/ is what is published, and is committed; it has to be what src/
      # builds, which npm test rebuilds.
      - run: npm test
      - run: git diff --exit-code -- dist
      - run: npm publish --provenance --access public

  pypi:
    needs: version
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s python/tests
      - run: python -m pip install build && python -m build python --outdir python-dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: python-dist
