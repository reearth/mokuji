name: Release

# The `mokuji` command, from a v* tag: built for each platform by goreleaser
# (.goreleaser.yaml), signed, and published to Homebrew. As reearth/cli does.

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # create the GitHub release
      id-token: write # cosign keyless signing and attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the changelog needs the full history
          persist-credentials: false

      # `mokuji --version` prints the crate's version, so the tag has to be it.
      - name: The tag is the crate's version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Cargo.toml says $version, but the tag is $GITHUB_REF_NAME."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,x86_64-apple-darwin,aarch64-apple-darwin,x86_64-pc-windows-gnu
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-zigbuild

      # GITHUB_TOKEN can only write to this repository. Publishing to the
      # Homebrew tap uses the org's reearth-app installation, with a token
      # narrowed to that repository.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: reearth
          repositories: homebrew-tap

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_APP_USER: ${{ vars.GH_APP_USER }}

      - name: Locate checksums
        id: sums
        run: echo "path=dist/mokuji_${GITHUB_REF_NAME#v}_checksums.txt" >> "$GITHUB_OUTPUT"

      # Build provenance for every artifact listed in the checksums file.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ steps.sums.outputs.path }}
