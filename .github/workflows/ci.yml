name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features
      - run: cargo test --all-features
      # The library without the command, as a program depending on it builds
      # it: nothing in it may need what only the cli feature brings.
      - name: the library builds and passes without the cli feature
        run: cargo clippy --all-targets && cargo test
      - run: cargo doc --no-deps --all-features
      - name: conformance fixtures are current
        run: python3 conformance/fixtures/build_fixtures.py --check

  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            tools/importance-order
            tools/fst-comparison
      # The measurement tools are outside the crate and nothing else builds
      # them, so a change to the library broke one unnoticed once; building
      # them here is what keeps their numbers re-takeable (tools/README.md).
      - run: cargo build --all-targets
        working-directory: tools/importance-order
      - run: cargo build --all-targets
        working-directory: tools/fst-comparison

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # The JavaScript reader is a third implementation of the specification
      # and answers to the same conformance cases as the others.
      - run: npm ci
        working-directory: js
      - run: npm test
        working-directory: js
      # dist/ is committed, so that the package can be depended on straight
      # from git without a build step; it has to be what src/ builds.
      - name: js/dist is current
        run: git diff --exit-code -- js/dist

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The Python reader, a fourth implementation, against the same cases.
      # No dependencies, so the runner's own Python 3 is enough; the check
      # against the TypeScript reader runs on its Node and js/dist.
      - run: python3 -m unittest discover -s python/tests

  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest Go go/go.mod accepts, and the newest.
        go: ["1.23", stable]
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      - run: go vet ./...
      # The Go reader against the same cases, read counts included, and
      # against the Python reader's answers on the runner's own Python 3.
      - run: go test -race ./...

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@0acae73baee12cc81c9b1fb9e8f8b7672bf17c6a # 1.85.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo check --all-targets --all-features
