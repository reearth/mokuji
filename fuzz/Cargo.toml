[package]
name = "colex-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
colex-meta = { path = "../crates/colex-meta" }
colex-read = { path = "../crates/colex-read" }

[[bin]]
name = "read"
path = "fuzz_targets/read.rs"
test = false
