# Conformance cases.
#
# Each case states the query, the expected result, and the number of range
# reads a conformant reader performs. The read count is checked because the
# bound in SPEC.md section 4 is the property the format exists to provide, and
# an untested bound drifts.
#
# Counts exclude the reads that populate the resident set, which SPEC.md
# section 4 accounts for separately. They assume a reader that caches payload
# blocks within a query, which is what makes the payload term smaller than the
# result count.
#
# Verified independently by conformance/fixtures/build_tiny.py, which builds the
# fixtures from SPEC.md and checks every case here before writing them.
#
# `tiny` is a small document collection: several terms per document, postings
# stored, payload opaque, every section raw so the file can be read by hand.
# `dict` is a dictionary: one term per record, postings implied throughout, and
# payload stored as delta-coded integers.

[[case]]
name = "single term"
fixture = "tiny"
query = ["tokyo"]
docs = [0, 1, 2]
payloads = ["35.694,139.754", "35.671,139.772", "35.664,139.698"]
reads = 4 # 1 term block, 1 postings, 2 payload blocks for 3 documents

[[case]]
name = "intersection"
fixture = "tiny"
query = ["tokyo", "chuo"]
docs = [1]
payloads = ["35.671,139.772"]
reads = 5 # 2 term blocks, 2 postings, 1 payload

[[case]]
name = "implied postings"
fixture = "tiny"
query = ["chiyoda"]
docs = [0]
payloads = ["35.694,139.754"]
# `chiyoda` names document 0 and is term 0, so SPEC.md §5.3.4 lets the
# dictionary entry state its postings. One term block, one payload, and no
# postings read at all.
reads = 2

[[case]]
name = "empty intersection"
fixture = "tiny"
query = ["osaka", "tokyo"]
docs = []
payloads = []
reads = 4 # both terms resolve; no payload is fetched

[[case]]
name = "absent term"
fixture = "tiny"
query = ["kyoto"]
docs = []
payloads = []
reads = 1 # the term index narrows to one block, which is read to prove absence

[[case]]
name = "dictionary lookup"
fixture = "dict"
query = ["東京都千代田区丸の内1丁目1番1号"]
docs = [1]
payloads = ["139.767201,35.681560"]
# One term block, one payload block. No postings read: every term in a
# dictionary index names its own document (SPEC.md §5.3.4).
reads = 2

[[case]]
name = "dictionary lookup, first record"
fixture = "dict"
query = ["大阪府大阪市中央区本町1丁目1番1号"]
docs = [0]
payloads = ["135.501000,34.682000"]
reads = 2

[[case]]
name = "absent from a dictionary"
fixture = "dict"
query = ["東京都新宿区"]
docs = []
payloads = []
reads = 1
