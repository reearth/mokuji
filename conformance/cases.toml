# Conformance cases.
#
# Each case states the query, the expected result, and the number of range
# reads a conformant reader performs. The read count is checked because the
# bound in SPEC.md section 4 is the property the format exists to provide, and
# an untested bound drifts.
#
# Counts exclude the reads that populate the resident set, which SPEC.md
# section 4 accounts for separately. They assume a reader that caches payload
# blocks within a query, which is what makes the payload term smaller than the
# result count.
#
# Verified independently by conformance/fixtures/build_fixtures.py, which builds
# the fixtures from SPEC.md and checks the result and read count of every case
# below before writing them. The `positions` and `attribute` expectations are
# checked by the Rust and browser readers only; the fixture builder writes those
# sections but does not query them.
#
# `tiny` is a small document collection: several terms per document, postings
# stored as runs, inline in their entries, and implied, payload opaque, every
# section raw so the file can be read by hand.
# `dict` is a dictionary: one term per record, postings implied throughout, and
# payload stored as delta-coded integers.
# `tiny-extra` is `tiny` with two sections this version does not define, one in
# the specification's range and one in the application's.
# `names` is a gazetteer for completion: `name-list`, and a completions section,
# with every postings run stored rather than inline.

[[case]]
name = "single term"
fixture = "tiny"
query = ["tokyo"]
docs = [0, 1, 2]
payloads = ["35.694,139.754", "35.671,139.772", "35.664,139.698"]
reads = 4 # 1 term block, 1 postings, 2 payload blocks for 3 documents

[[case]]
name = "the magic that named its version"
fixture = "tiny-v0"
query = ["tokyo"]
docs = [0, 1, 2]
payloads = ["35.694,139.754", "35.671,139.772", "35.664,139.698"]
reads = 4 # `tiny` with the magic MOKUJIv0, which a 0.x reader still reads

[[case]]
name = "intersection"
fixture = "tiny"
query = ["tokyo", "chuo"]
docs = [1]
payloads = ["35.671,139.772"]
# 2 term blocks, 1 postings, 1 payload. `chuo`'s two documents are written
# inline in its dictionary entry (SPEC.md §5.3.4); `tokyo`'s run is shorter than
# inline would be, so it is read.
reads = 4

[[case]]
name = "implied postings"
fixture = "tiny"
query = ["chiyoda"]
docs = [0]
payloads = ["35.694,139.754"]
# `chiyoda` names document 0 and is term 0, so SPEC.md §5.3.4 lets the
# dictionary entry state its postings. One term block, one payload, and no
# postings read at all.
reads = 2

[[case]]
name = "empty intersection"
fixture = "tiny"
query = ["osaka", "tokyo"]
docs = []
payloads = []
reads = 3 # 2 term blocks, `tokyo`'s postings; `osaka`'s are inline, and no payload is fetched

[[case]]
name = "inline postings"
fixture = "tiny"
query = ["osaka"]
docs = [3]
payloads = ["34.681,135.513"]
# `osaka` is term 2 and names document 3, so its postings cannot be implied, but
# they are written in its dictionary entry: the term block and the payload.
reads = 2

[[case]]
name = "absent term"
fixture = "tiny"
query = ["kyoto"]
docs = []
payloads = []
reads = 1 # the term index narrows to one block, which is read to prove absence

[[case]]
name = "dictionary lookup"
fixture = "dict"
query = ["東京都千代田区丸の内1丁目1番1号"]
docs = [1]
payloads = ["139.767201,35.681560"]
# One term block, one payload block. No postings read: every term in a
# dictionary index names its own document (SPEC.md §5.3.4).
reads = 2

[[case]]
name = "dictionary lookup, first record"
fixture = "dict"
query = ["大阪府大阪市中央区本町1丁目1番1号"]
docs = [0]
payloads = ["135.501000,34.682000"]
reads = 2

[[case]]
name = "absent from a dictionary"
fixture = "dict"
query = ["東京都新宿区"]
docs = []
payloads = []
reads = 1

[[case]]
name = "positions"
fixture = "tiny"
query = ["chuo"]
docs = [1, 3]
payloads = ["35.671,139.772", "34.681,135.513"]
# `chuo` is the second word of both documents it appears in. Positions are the
# one section a reader pays for only when it asks: everything above answers
# without reading the run at all.
positions = [[1], [1]]
# 1 term block and 2 payload blocks, with `chuo`'s postings inline in its entry
# — and one more read to ask for the positions, which are never inline.
reads = 3

[[case]]
name = "attribute column"
fixture = "dict"
query = ["東京都千代田区丸の内1丁目1番1号"]
docs = [1]
payloads = ["139.767201,35.681560"]
# Resident, so reading it costs nothing: the read count is the same as the case
# above that does not ask for it. That is the point of the section — a scorer
# weighs many documents before deciding whose payload is worth fetching.
attribute = "importance"
values = [90]
reads = 2

[[case]]
name = "unrecognized sections are ignored"
fixture = "tiny-extra"
query = ["tokyo"]
docs = [0, 1, 2]
payloads = ["35.694,139.754", "35.671,139.772", "35.664,139.698"]
# The same answer and the same reads as the same query against `tiny`. A reader
# that stumbled on a section it does not know, or that counted one, would
# differ here.
reads = 4

[[case]]
name = "unrecognized sections do not disturb implied postings"
fixture = "tiny-extra"
query = ["chiyoda"]
docs = [0]
payloads = ["35.694,139.754"]
reads = 2

[[case]]
name = "unrecognized sections do not disturb an absent term"
fixture = "tiny-extra"
query = ["kyoto"]
docs = []
payloads = []
reads = 1

[[case]]
name = "a name is one term"
fixture = "names"
query = ["tokyo"]
docs = [4]
payloads = ["Tokyo"]
reads = 3 # 1 term block, 1 postings, 1 payload

[[case]]
name = "a name in another script is one term too"
fixture = "names"
query = ["東京"]
docs = [4]
payloads = ["Tokyo"]
reads = 3

# Completion cases (SPEC.md §5.3.5). `prefix` is already normalized; `limit` is
# how many documents are wanted. A reader answers from the completions section
# when the prefix has an entry that reaches the limit — or that lists fewer than
# `docs_per_entry`, which means it lists them all — and otherwise walks every
# term the prefix matches (§4.1), returning documents in document order.
#
# `names` has an entry for every prefix at least two terms begin with, listing
# two documents each.

[[completion]]
name = "an expensive prefix answered by its entry"
fixture = "names"
prefix = "bl"
limit = 2
docs = [0, 1]
payloads = ["Black Sea", "Black Forest"]
from_table = true
reads = 1 # nothing before the payload; both documents share a payload block

[[completion]]
name = "more than the entry lists"
fixture = "names"
prefix = "bl"
limit = 3
docs = [0, 1, 2]
payloads = ["Black Sea", "Black Forest", "Blackpool"]
from_table = false
# 2 term blocks, 1 postings read for the two runs stored — `blackpool` and
# `bled` name their own documents — and 2 payload blocks.
reads = 5

[[completion]]
name = "a cheap prefix has no entry"
fixture = "names"
prefix = "black s"
limit = 10
docs = [0]
payloads = ["Black Sea"]
from_table = false
reads = 3 # 1 term block, 1 postings, 1 payload

[[completion]]
name = "a prefix of a character's bytes"
fixture = "names"
prefix = "東"
limit = 2
docs = [4, 5]
payloads = ["Tokyo", "Tohoku"]
from_table = true
reads = 1

[[completion]]
name = "an absent prefix"
fixture = "names"
prefix = "x"
limit = 10
docs = []
payloads = []
from_table = false
reads = 1 # the one block it would be in

# Collection cases (MANIFEST.md §3.2). `manifest` names a manifest in
# fixtures/; `segments` and `docs` give each result as the segment it is in and
# its ID there. Reads include the payload, and exclude opening.
#
# `collection` is `names`, then `names-delta`, with Black Sea — the first
# document every `b` entry of `names` lists — deleted from `names`.

[[collection]]
name = "a delete leaves an entry short, so the segment reads its dictionary"
manifest = "collection"
prefix = "bl"
limit = 2
segments = [0, 0]
docs = [1, 2]
payloads = ["Black Forest", "Blackpool"]
# The entry, twice, at no read; then 2 term blocks and 1 postings read; then
# 2 payload blocks.
reads = 5

[[collection]]
name = "a later segment follows every document of an earlier one"
manifest = "collection"
prefix = "black"
limit = 10
segments = [0, 0, 1]
docs = [1, 2, 0]
payloads = ["Black Forest", "Blackpool", "Black Mountain"]
# names: 2 term blocks, 1 postings. The delta: 1 term block, and `black
# mountain` names its own document. Payload: 2 blocks in names, 1 in the delta.
reads = 7

[[collection]]
name = "a later segment is not asked once the limit is met"
manifest = "collection"
prefix = "t"
limit = 2
segments = [0, 0]
docs = [4, 5]
payloads = ["Tokyo", "Tohoku"]
reads = 1 # the entry answers; one payload block

[[collection]]
name = "a prefix only a later segment has"
manifest = "collection"
prefix = "東京タ"
limit = 10
segments = [1]
docs = [1]
payloads = ["Tokyo Tower"]
# names: the one block that proves it absent. The delta: the block before the
# boundary key `東京タワー`, read on faith (SPEC.md §4.1), then that block, its
# run, and the payload.
reads = 5

# `names-delta` states that its places are in Japan (MANIFEST.md §7); `names`
# states no region. `countries` restricts a case to the segments whose region
# includes one of them, and those with none; segment numbers are then positions
# among those.

[[collection]]
name = "a segment elsewhere is not opened"
manifest = "collection"
prefix = "東京タ"
limit = 10
countries = ["FR"]
segments = []
docs = []
payloads = []
reads = 1 # names alone: the one block that proves it absent

[[collection]]
name = "a segment in the place asked about is"
manifest = "collection"
prefix = "東京タ"
limit = 10
countries = ["JP", "KR"]
segments = [1]
docs = [1]
payloads = ["Tokyo Tower"]
reads = 5



# Malformed files (SPEC.md §8). Each is a fixture above with one rule broken,
# made by conformance/fixtures/build_fixtures.py, which says how. A reader
# passes a case when it rejects the file, cleanly, either when it opens it or
# when it is asked the case's question: `query`, one term looked up with its
# postings and payload read; `prefix`, completed to `limit`; or `attribute`, a
# column read. Cleanly means the reader's own error, not a crash, a panic, or
# an error the language raises for a bug such as an index out of range, and
# without allocating what a count or length in the file asks for.

[[malformed]]
name = "bad-magic"
fixture = "malformed/bad-magic"
rule = "SPEC.md §5.1: the magic does not match"
query = "tokyo"

[[malformed]]
name = "unknown-major"
fixture = "malformed/unknown-major"
rule = "SPEC.md §5.1: a spec_major this version does not define"
query = "tokyo"

[[malformed]]
name = "table-past-end"
