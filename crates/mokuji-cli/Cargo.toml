[package]
name = "mokuji-cli"
description = "Command line tools for the Mokuji format"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "mokuji_cli"
path = "src/lib.rs"

[[bin]]
name = "mokuji"
path = "src/main.rs"

[dependencies]
mokuji-format.workspace = true
mokuji-meta.workspace = true
mokuji-manifest.workspace = true
mokuji-read.workspace = true
mokuji-tokenize.workspace = true
mokuji.workspace = true
mokuji-write.workspace = true
sha2 = "0.10"
unicode-normalization = "0.1"

[dev-dependencies]
proptest = "1"
tempfile = "3"


[lints]
workspace = true
