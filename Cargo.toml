[package]
name = "mokuji"
description = "A cloud-optimized concordance format: build, read and search a Mokuji file, reading only what a query needs"
version = "0.2.1"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/reearth/mokuji"
authors = ["Re:Earth and contributors"]
readme = "README.md"
keywords = ["search", "index", "geocoding", "range-requests", "serverless"]
categories = ["data-structures", "encoding", "text-processing", "command-line-utilities"]
# The repository also holds the TypeScript and Python readers, the page and
# the demos; the crate is the library, the command, and the documents that
# say what they implement. The tests read conformance/, which every
# implementation shares, so they stay in the repository.
include = [
    "/src/**/*.rs",
    "/README.md",
    "/SPEC.md",
    "/MANIFEST.md",
    "/TOKENIZERS.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[features]
# The `mokuji` command and what it alone depends on. Off by default, so that a
# program using the library does not build the command:
#   cargo install mokuji --features cli
cli = ["dep:sha2"]

# The command line tool, built from the same crate as the library.
[[bin]]
name = "mokuji"
path = "src/main.rs"
doc = false
required-features = ["cli"]

# The tests that drive the command.
[[test]]
name = "cli_build_verify"
required-features = ["cli"]

[[test]]
name = "cli_collection"
required-features = ["cli"]

[[test]]
name = "cli_fixture"
required-features = ["cli"]

[dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", optional = true }
unicode-normalization = "0.1"

[dev-dependencies]
proptest = "1"
tempfile = "3"
toml = "0.9"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
