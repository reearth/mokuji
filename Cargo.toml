[workspace]
resolver = "2"
members = [
    "crates/mokuji-format",
    "crates/mokuji-meta",
    "crates/mokuji-codec",
    "crates/mokuji-read",
    "crates/mokuji-write",
    "crates/mokuji-cli",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/reearth/mokuji"
authors = ["Re:Earth and contributors"]

[workspace.dependencies]
mokuji-format = { path = "crates/mokuji-format", version = "0.0.0" }
mokuji-meta = { path = "crates/mokuji-meta", version = "0.0.0" }
mokuji-codec = { path = "crates/mokuji-codec", version = "0.0.0" }
mokuji-read = { path = "crates/mokuji-read", version = "0.0.0" }
mokuji-write = { path = "crates/mokuji-write", version = "0.0.0" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
